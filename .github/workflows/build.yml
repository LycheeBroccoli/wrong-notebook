name: Build wrong-notebook image

  on:
    workflow_dispatch:
      inputs:
        tag:
          description: '镜像 tag（默认用 commit 短 sha）'
          required: false
          default: ''

  env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

  jobs:
    build-and-push:
      runs-on: ubuntu-latest
      permissions:
        contents: read
        packages: write

      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Login to GHCR
          uses: docker/login-action@v3
          with:
            registry: ${{ env.REGISTRY }}
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Resolve tags
          id: tags
          run: |
            SHA="${GITHUB_SHA::7}"
            TAG_INPUT="${{ inputs.tag }}"
            if [ -n "$TAG_INPUT" ]; then
              echo "tags=${REGISTRY}/${IMAGE_NAME}:${TAG_INPUT}" >> $GITHUB_OUTPUT
            else
              echo "tags=${REGISTRY}/${IMAGE_NAME}:${SHA}" >> $GITHUB_OUTPUT
            fi

        - name: Build and push
          uses: docker/build-push-action@v6
          with:
            context: .
            file: ./Dockerfile
            push: true
            tags: ${{ steps.tags.outputs.tags }}
            # 不写 platforms —— 只构建 runner 原生 amd64，最快最稳
            cache-from: type=gha
            cache-to: type=gha,mode=max